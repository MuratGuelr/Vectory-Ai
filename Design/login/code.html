<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vectory AI Login</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec37",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102213",
                        "surface-dark": "#1c2e1f", // Slightly lighter than background-dark for cards
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display min-h-screen flex items-center justify-center p-4">
<!-- Background Decoration -->
<div aria-hidden="true" class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<!-- Abstract gradient blob 1 -->
<div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px]"></div>
<!-- Abstract gradient blob 2 -->
<div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-primary/5 rounded-full blur-[100px]"></div>
<!-- Grid pattern overlay -->
<div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 brightness-150 contrast-150 mix-blend-overlay"></div>
</div>
<!-- Main Modal Container -->
<div class="relative z-10 w-full max-w-[480px] bg-white dark:bg-[#151f16] border border-slate-200 dark:border-white/10 rounded-2xl shadow-2xl overflow-hidden backdrop-blur-xl">
<!-- Header Section with Image & Logo -->
<div class="relative h-48 w-full bg-cover bg-center flex flex-col justify-end p-6" data-alt="Abstract dark geometric neon grid pattern" style="background-image: linear-gradient(180deg, rgba(16, 34, 19, 0) 0%, #151f16 100%), url('https://lh3.googleusercontent.com/aida-public/AB6AXuCaKFIo0I6UsqGLqbvdwPH2PiYv24fd8ypDhH-32jPZk1mdrzKp7hrcxIqhAQ5imvY_x4rsgCIhPAFrzEdbX8MNKjZeuhYY4FUtzZZ4LAWTalZlXu_0QZ-4XKIueAK14DiolEXVIJ7Ls_Wkwu4VU027B6II10YbCnX7pZgpDd5LMUC3-DQqeWYVnpgsI-Jqc3S0i0I-_cjg3A4Kj9UpfZ_LJb4yDHZeCVmWEnBTprjDxmXELuC4ir_-jI4sc57VV943RjEBJvAlA8fr');">
<div class="absolute top-6 left-6 flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-background-dark">
<span class="material-symbols-outlined text-xl">polyline</span>
</div>
<span class="text-white font-bold text-lg tracking-tight">Vectory AI</span>
</div>
<h1 class="text-3xl font-bold text-white leading-tight">Welcome Back</h1>
<p class="text-slate-300 text-sm mt-1">Turn your pixels into paths in seconds.</p>
</div>
<!-- Form Content -->
<div class="p-6 pt-2 flex flex-col gap-5">
<!-- Google Button -->
<button class="flex w-full items-center justify-center gap-3 rounded-full h-12 px-5 bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-white hover:bg-slate-50 dark:hover:bg-white/10 transition-all duration-200 group">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M23.766 12.2764C23.766 11.4607 23.6999 10.6406 23.5588 9.83807H12.24V14.4591H18.7217C18.4528 15.9494 17.5885 17.2678 16.323 18.1056V21.1039H20.19C22.4608 19.0139 23.7662 15.9274 23.766 12.2764Z" fill="#4285F4"></path>
<path d="M12.2401 24.0008C15.4766 24.0008 18.2059 22.9382 20.1945 21.1039L16.3275 18.1055C15.2517 18.8375 13.8627 19.252 12.2445 19.252C9.11388 19.252 6.45946 17.1399 5.50705 14.2812H1.46395V17.4218C3.53296 21.5366 7.63288 24.0008 12.2401 24.0008Z" fill="#34A853"></path>
<path d="M5.50253 14.2812C5.00309 12.7805 5.00309 11.2195 5.50253 9.71885V6.57828H1.46395C-0.422078 10.3342 -0.422078 14.6658 1.46395 18.4218L5.50253 14.2812Z" fill="#FBBC05"></path>
<path d="M12.2401 4.74966C13.9509 4.7232 15.6044 5.36697 16.8434 6.54867L20.2695 3.12262C18.1001 1.0855 15.2208 -0.034466 12.2401 0.000808666C7.63288 0.000808666 3.53296 2.46498 1.46395 6.57999L5.50262 9.72056C6.45064 6.86188 9.10947 4.74966 12.2401 4.74966Z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-bold tracking-wide">Continue with Google</span>
</button>
<!-- Divider -->
<div class="relative flex py-1 items-center">
<div class="flex-grow border-t border-slate-200 dark:border-white/10"></div>
<span class="flex-shrink-0 mx-4 text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">Or continue with email</span>
<div class="flex-grow border-t border-slate-200 dark:border-white/10"></div>
</div>
<!-- Email Input -->
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-200 text-sm font-semibold ml-1">Email Address</span>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full h-12 pl-11 pr-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-full text-sm text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" placeholder="name@example.com" type="email"/>
</div>
</label>
<!-- Password Input -->
<label class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<span class="text-slate-700 dark:text-slate-200 text-sm font-semibold">Password</span>
<a class="text-xs font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-12 pl-11 pr-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-full text-sm text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</label>
<!-- Submit Button -->
<button class="w-full h-12 mt-2 bg-primary hover:bg-green-400 text-background-dark font-bold text-sm rounded-full tracking-wide shadow-[0_0_20px_rgba(19,236,55,0.3)] hover:shadow-[0_0_30px_rgba(19,236,55,0.5)] transition-all duration-300 transform hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg font-bold">arrow_forward</span>
</button>
<!-- Footer -->
<p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-2 pb-2">
                New here? <a class="text-slate-900 dark:text-white font-bold hover:text-primary transition-colors" href="#">Create an account</a>
</p>
</div>
</div>
</body></html>
